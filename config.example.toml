# mr-reviewer config. Copy to ~/.config/mr-reviewer/config.toml and edit.
# Secrets never go in this file: set LLM_API_KEY, GITLAB_TOKEN, JIRA_TOKEN, SONAR_TOKEN
# in the environment, or store them in the macOS keychain (see README).

[llm]
base_url = "https://internal-ai.example.com/v1"   # LLM_BASE_URL overrides this
model = "MODEL_ID"
max_context_tokens = 32768   # replaced by max_model_len from /v1/models when the server reports it
max_output_tokens = 4096
timeout_s = 300
concurrency = 2

[gitlab]
url = "https://gitlab.example.com"
workspace = "~/.cache/mr-reviewer/repos"
# ssh_host = ""          # host git may clone from over SSH; defaults to the host of url

# Optional. Remove the section to run without Jira.
[jira]
url = "https://jira.example.com"
key_pattern = "[A-Z][A-Z0-9]+-\\d+"
acceptance_criteria_field = ""   # optional, e.g. "customfield_10042"
projects = []                    # optional allowlist of project keys, e.g. ["BANK", "PAY"]

# Optional.
[sonar]
url = "https://sonar.example.com"
enabled = false

[review]
max_findings = 10
verify = true
conventions_file = ""   # path inside the reviewed repo, e.g. "CONVENTIONS.md"
neighbours = true       # show signatures of imported / same-package files to the model
max_neighbours = 8
repomix = false         # use a locally installed repomix --compress (npm i -D repomix in this tool)
# repomix_path = ""     # explicit path to the repomix binary
# exclude = ["**/package-lock.json", "**/generated/**"]   # defaults cover lockfiles and build output

[network]
ca_bundle = ""          # extra PEM file with the company CA, if it isn't in the macOS keychain
use_system_ca = true    # trust the macOS keychain's CAs
proxy = ""              # overrides HTTPS_PROXY/HTTP_PROXY; no credentials here
no_proxy = ""           # overrides NO_PROXY, e.g. "gitlab.example.com,jira.example.com"
